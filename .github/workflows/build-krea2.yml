name: Build Krea 2 Raw only
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free disk on remote runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish one Krea image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          platforms: linux/amd64
          push: true
          tags: ghcr.io/rola2194/worker-comfyui-krea2:${{ github.sha }}
          build-args: |
            MODEL_TYPE=krea2-raw-fp8
